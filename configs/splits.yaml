# PRE-REGISTERED SPLITS. Committed before any model training (see git history).
# Do not change after seeing results; any change must be logged in DECISIONS.md with a reason.
#
# Normalized NLSE: i U_xi = (s/2) U_tautau - N^2 |U|^2 U.  Fields are SSFM on configs/grid.yaml.

seeds: [0, 1, 2]          # 3 per (model, regime, experiment); 5 only if budget allows (then 3, 4 appended)

regimes:
  A:                      # primary: normal dispersion, Gaussian input, GVD + SPM
    s: 1
    pulse: gaussian
    N:
      train:  [1.0, 1.2, 1.4, 1.6, 1.8, 2.0]
      interp: [1.1, 1.3, 1.5, 1.7, 1.9]
      near:   [2.25, 2.5]
      far:    [3.0, 4.0]
  B_sech:                 # secondary: anomalous dispersion, sech input
    s: -1
    pulse: sech
    N:
      train:  [0.8, 1.0, 1.2, 1.4, 1.6]
      interp: [0.9, 1.1, 1.3, 1.5]
      extrap: [2.0, 3.0]  # crosses into higher-order soliton breathing
  B_gauss:                # secondary: anomalous dispersion, Gaussian input
    s: -1
    pulse: gaussian
    N:
      train:  [0.8, 1.0, 1.2, 1.4, 1.6]
      interp: [0.9, 1.1, 1.3, 1.5]
      extrap: [2.0, 3.0]

experiments:
  n_extrap:
    # One training run per (model, regime, seed). Evaluated on every N split.
    # "In-distribution" results = the train and interp splits of this same run.
    xi_train: [0.0, 4.0]
    xi_eval:  [0.0, 4.0]
    eval_splits: all
  z_extrap:
    # Train on xi in [0, 2] only (labels AND PINN collocation), evaluate on xi in (2, 4].
    xi_train: [0.0, 2.0]
    xi_eval:  [2.0, 4.0]     # exclusive at 2.0
    eval_N_splits: [train, interp]

# Collocation N-range for physics-informed models (no labels involved; the IC is N-independent).
collocation_N:
  strict:   train_range                    # [min(train), max(train)]
  extended: train_and_test_range           # [min(train), max(all splits)], e.g. A: [1.0, 4.0]
  extended_in_z_extrap: not_run            # in z_extrap, xi <= 2 for all PINNs, so extended adds nothing to the z question

metrics_primary: rel_l2_full_field         # relative L2 of complex U over the evaluated (xi, tau) grid
hyperparameter_tuning_split: interp        # never tune on near/far/extrap or on xi > 2
